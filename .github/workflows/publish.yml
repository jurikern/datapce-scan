name: publish
# Builds the package and uploads it to PyPI with trusted publishing (OIDC). No token is stored.
# Runs on a v* tag push, or by hand (Actions > publish > Run workflow) from a branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run the tests
        run: python -m unittest discover -s tests -t . -v
      - name: Install uv (exact pin, hash-checked)
        run: python -m pip install --require-hashes --no-deps -r .github/publish-requirements.txt
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != vers
      - name: Build
        run: uv build --out-dir dist
      - name: Upload to PyPI
        run: uv publish --trusted-publishing always dist/*
